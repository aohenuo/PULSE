[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pceu-rtr-core"
version = "0.1.0"
description = "PULSE demonstration selection from precomputed sparse autoencoder features"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
eval = ["transformers==4.57.6", "sae-lens==6.5.0", "sentencepiece>=0.2"]

[project.scripts]
pulse-select = "pceu_rtr.cli:main"
pulse-eval = "pceu_rtr.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pceu-rtr-core/dataset" = ["dataset/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
