[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "PULSE-guided in-context exemplar selection experiments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers>=4.38,<5",
  "sae-lens==6.37.1",
]

[tool.setuptools.packages.find]
include = ["pulse*"]
